[project]
name = "quantsim"
version = "0.1.0"
description = "From-scratch PyTorch quantum circuit simulator + QNN training visualizer (arXiv:2606.03517)"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest",
]
server = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
]

[tool.uv]
# CPU wheels by default (dev VM). On the desktop (RTX 5080 / Blackwell):
#   uv sync --extra-index-url https://download.pytorch.org/whl/cu128
# or flip the index below to the cu128 URL.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantsim"]
