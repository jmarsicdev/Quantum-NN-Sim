<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"></meta>
<meta name="viewport" content="width=device-width, initial-scale=1.0"></meta>
<title>quantSim — QNN training visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"></link>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"></link>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"></link>
<style>
  :root {
    --bg: #0c0a0f;
    --panel: #131118;
    --panel-2: #0f0d14;
    --line: rgba(232, 226, 250, 0.08);
    --line-strong: rgba(232, 226, 250, 0.14);
    --text: #e9e6f2;
    --muted: #8d87a0;
    --faint: #565066;
    --c-exact: #38bdf8;
    --c-naive: #fb7185;
    --c-par: #fbbf24;
    --anim-scale: 0.6;
    --font-ui: "Space Grotesk", "Helvetica Neue", sans-serif;
    --font-mono: "JetBrains Mono", "SF Mono", monospace;
    --pad: 18px;
    --gap: 14px;
  }
  .density-dense { --pad: 12px; --gap: 10px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 70% -10%, rgba(70, 60, 110, 0.12), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.45;
    min-height: 100vh;
  }
  .mono { font-family: var(--font-mono); }
  b { font-weight: 600; }

  .shell { max-width: 1560px; margin: 0 auto; padding: 0 22px 40px 22px; }

  /* ——— top bar ——— */
  .topbar {
    display: flex; align-items: center; gap: 22px;
    padding: 16px 4px 14px 4px;
    border-bottom: 1px solid var(--line);
    margin-bottom: var(--gap);
  }
  .brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .brand-mark { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .brand-accent { color: var(--c-par); }
  .brand-tag {
    font-size: 11px; color: var(--muted); letter-spacing: 0.14em;
    text-transform: uppercase; white-space: nowrap;
  }
  @media (max-width: 1240px) { .brand-tag { display: none; } }
  @media (max-width: 760px) { .ws-chip .mono { display: none; } }
  .run-readout {
    margin-left: auto; display: flex; gap: 10px; align-items: center;
    font-size: 12px; color: var(--muted);
  }
  .run-readout b { color: var(--text); font-weight: 600; }
  .sep { color: var(--faint); }
  .run-state { text-transform: uppercase; letter-spacing: 0.1em; font-size: 11px; }
  .run-running { color: var(--c-par); }
  .run-paused { color: var(--muted); }
  .run-done { color: var(--c-exact); }
  .run-state-dim { color: var(--faint); font-size: 12px; }
  .ws-chip {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 5px 12px; font-size: 11px; color: var(--muted);
  }
  .ws-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .chip-ok .ws-dot { background: #4ade80; box-shadow: 0 0 8px rgba(74, 222, 128, 0.7); }
  .chip-wait .ws-dot { background: var(--c-par); animation: blink 1s infinite; }
  .chip-bad { border-color: rgba(248, 113, 113, 0.45); color: #fca5a5; }
  .chip-bad .ws-dot { background: #f87171; animation: blink 0.6s infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }

  .banner-drop {
    display: flex; align-items: center; gap: 10px;
    background: color-mix(in oklab, var(--c-naive) 12%, var(--panel));
    border: 1px solid color-mix(in oklab, var(--c-naive) 40%, transparent);
    color: var(--text);
    border-radius: 8px; padding: 9px 14px; font-size: 12.5px;
    margin-bottom: var(--gap);
  }
  .banner-drop .ws-dot { background: var(--c-naive); animation: blink 0.6s infinite; }

  /* ——— layout ——— */
  .layout { display: grid; grid-template-columns: 1fr 292px; gap: var(--gap); align-items: start; }
  .main-col { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
  .duo { display: grid; grid-template-columns: 1.35fr 1fr; gap: var(--gap); }
  .sidebar { position: sticky; top: 14px; }
  @media (max-width: 1180px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; }
    .duo { grid-template-columns: 1fr; }
  }

  /* ——— panels ——— */
  .panel {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: visible;
  }
  .panel-head {
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap; row-gap: 2px;
    min-height: 41px;
    padding: 10px var(--pad) 9px var(--pad);
    border-bottom: 1px solid var(--line);
  }
  .panel-title {
    margin: 0; font-size: 11.5px; font-weight: 600; white-space: nowrap; flex: none;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
  }
  .panel-meta {
    margin-left: auto; font-size: 11px; color: var(--faint);
    flex: 0 1 auto; min-width: 0; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .panel-body { padding: var(--pad); position: relative; }

  /* info popover */
  .info-wrap { position: relative; display: inline-flex; flex: none; }
  .panel-head .info-wrap:last-child { margin-left: 6px; }
  .info-dot {
    width: 18px; height: 18px; border-radius: 50%;
    border: 1px solid var(--line-strong); background: transparent;
    color: var(--muted); font-family: var(--font-mono); font-size: 10.5px;
    font-style: italic; cursor: pointer; padding: 0; line-height: 1;
    transition: all 0.15s;
  }
  .info-dot:hover, .info-dot.is-open {
    color: var(--c-par); border-color: var(--c-par);
    box-shadow: 0 0 10px color-mix(in oklab, var(--c-par) 35%, transparent);
  }
  .info-pop {
    position: absolute; right: 0; top: 26px; z-index: 60;
    width: 320px; padding: 14px 16px;
    background: #1a1722; border: 1px solid var(--line-strong);
    border-radius: 10px; box-shadow: 0 16px 44px rgba(0, 0, 0, 0.6);
  }
  .info-pop-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
  .info-pop-body { font-size: 12.5px; color: var(--muted); line-height: 1.55; text-wrap: pretty; }

  /* skeleton */
  .skel {
    border-radius: 8px;
    background: linear-gradient(100deg, rgba(255,255,255,0.03) 30%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 70%);
    background-size: 220% 100%;
    animation: shimmer 1.3s infinite linear;
  }
  @keyframes shimmer { to { background-position: -120% 0; } }

  /* ——— circuit diagram ——— */
  .cd-svg { width: 100%; height: auto; display: block; }
  .cd-rail { stroke: var(--line-strong); stroke-width: 1; }
  .cd-qlabel { fill: var(--faint); font-family: var(--font-mono); font-size: 10px; }
  .cd-gate { fill: #1c1926; stroke: var(--line-strong); stroke-width: 1; }
  .cd-gate-label { fill: var(--muted); font-family: var(--font-mono); font-size: 9.5px; }
  .cd-fly { stroke: var(--muted); stroke-width: 1; opacity: 0.75; }
  .cd-node { fill: var(--muted); }
  .cd-meas { stroke: var(--faint); fill: none; stroke-width: 1.2; }
  .cd-rxx { fill: #221e2e; stroke: var(--line-strong); stroke-width: 1; }
  .cd-rxx-label { fill: var(--muted); font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.02em; }
  .cd-encoding { opacity: 0.65; }
  .cd-layer-label {
    fill: var(--faint); font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.08em;
  }
  .cd-layer { transition: opacity 0.4s; }
  .cd-frozen { opacity: 0.30; }
  .cd-queued { opacity: 0.55; }
  .cd-training { opacity: 1; }
  .cd-training .cd-gate { stroke: var(--c-par); fill: color-mix(in oklab, var(--c-par) 12%, #1c1926); }
  .cd-training .cd-gate-label { fill: var(--c-par); }
  .cd-training .cd-fly { stroke: var(--c-par); opacity: 0.9; }
  .cd-training .cd-node { fill: var(--c-par); }
  .cd-training .cd-rxx { stroke: var(--c-par); fill: color-mix(in oklab, var(--c-par) 16%, #221e2e); }
  .cd-training .cd-rxx-label { fill: var(--c-par); }
  .cd-training .cd-layer-label { fill: var(--c-par); }
  .cd-active-frame {
    fill: none; stroke: color-mix(in oklab, var(--c-par) 45%, transparent);
    stroke-width: 1; stroke-dasharray: 3 4;
  }
  .cd-glow { filter: drop-shadow(0 0 calc(7px * var(--anim-scale) + 3px) color-mix(in oklab, var(--c-par) 60%, transparent)); }
  .cd-glow .cd-active-frame { animation: framePulse calc(2.6s / max(var(--anim-scale), 0.2)) ease-in-out infinite; }
  .no-pulse .cd-glow .cd-active-frame { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    .cd-glow .cd-active-frame, .skel, .chip-wait .ws-dot, .chip-bad .ws-dot { animation: none; }
  }
  @keyframes framePulse { 50% { stroke-opacity: 0.35; } }
  .hero-hint {
    margin-top: 10px; text-align: center; font-size: 11.5px; color: var(--muted);
    letter-spacing: 0.08em;
  }
  .hero-done { color: var(--c-exact); }

  /* ——— bloch row ——— */
  .bloch-row {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between;
    position: relative;
  }
  .bloch-tile {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    flex: 1 1 auto; min-width: 0;
  }
  .bloch-tile.is-idle { opacity: 0.45; }
  .bloch-meta { display: flex; align-items: center; gap: 7px; }
  .bloch-q { font-family: var(--font-mono); font-size: 10px; color: var(--faint); }
  .bloch-r { font-size: 10px; color: var(--muted); letter-spacing: 0.02em; }
  .bloch-tile.is-idle .bloch-r { color: var(--faint); }
  .bloch-ent-bar {
    width: 36px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.07);
    overflow: hidden; display: inline-block;
  }
  .bloch-ent-fill { display: block; height: 100%; border-radius: 2px; transition: width 0.4s; }
  .bloch-idle-note {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    letter-spacing: 0.1em; pointer-events: none;
  }

  /* ——— charts ——— */
  .loss-svg { width: 100%; height: auto; display: block; }
  .ch-grid { stroke: var(--line); stroke-width: 1; }
  .ch-tick { fill: var(--faint); font-family: var(--font-mono); font-size: 9.5px; }
  .ch-axis { fill: var(--faint); font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.08em; }
  .ch-layer-mark { stroke: var(--line-strong); stroke-dasharray: 2 4; stroke-width: 1; }
  .ch-layer-label { fill: var(--muted); font-family: var(--font-mono); font-size: 9.5px; }
  .ch-playhead { stroke: rgba(232, 226, 250, 0.3); stroke-width: 1; }
  .ch-empty { fill: var(--faint); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; }
  .loss-legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 8px; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); }
  .legend-swatch { width: 10px; height: 3px; border-radius: 2px; display: inline-block; flex: none; }
  .legend-val { color: var(--text); font-size: 11px; }

  /* ——— heatmap ——— */
  .heat-grid { display: grid; grid-template-columns: 30px 1fr 56px; gap: 0 8px; align-items: start; }
  .heat-rows, .heat-vals { display: flex; flex-direction: column; }
  .heat-rowlabel, .heat-val {
    display: flex; align-items: center; font-size: 10px; color: var(--faint);
  }
  .heat-val { color: var(--muted); justify-content: flex-end; }
  .heat-canvas { width: 100%; display: block; border-radius: 4px; }
  .heat-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px; gap: 12px; flex-wrap: wrap;
  }
  .heat-scale { display: flex; align-items: center; gap: 7px; font-size: 9.5px; color: var(--faint); }
  .heat-scale-bar { width: 70px; height: 6px; border-radius: 3px; display: inline-block; }
  .heat-scale-label { color: var(--faint); font-family: var(--font-mono); }
  .heat-warn {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--c-naive);
    border: 1px solid color-mix(in oklab, var(--c-naive) 40%, transparent);
    background: color-mix(in oklab, var(--c-naive) 10%, transparent);
    border-radius: 6px; padding: 3px 9px;
  }
  .heat-ok { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); }

  /* ——— budget odometer ——— */
  .budget-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
  @media (max-width: 900px) { .budget-row { grid-template-columns: 1fr; } }
  .budget-card {
    border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px 12px 16px; background: rgba(0, 0, 0, 0.22);
  }
  .budget-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .budget-name { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .odo { display: flex; gap: 3px; }
  .odo-cell {
    width: 22px; height: 32px; overflow: hidden; border-radius: 4px;
    background: linear-gradient(180deg, #07060a, #16131d 30%, #16131d 70%, #07060a);
    border: 1px solid var(--line);
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.7);
    position: relative; flex: none;
  }
  .odo-strip {
    display: flex; flex-direction: column;
    transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.3, 1);
    will-change: transform;
  }
  .odo-num {
    height: 32px; flex: none; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 16px; font-weight: 500; color: var(--mode-c, var(--text));
  }
  .odo-dim .odo-num { color: var(--faint); opacity: 0.5; }
  .budget-sub { margin-top: 8px; font-size: 10px; color: var(--muted); }
  .budget-bar {
    margin-top: 8px; height: 3px; border-radius: 2px;
    background: rgba(255, 255, 255, 0.06); overflow: hidden;
  }
  .budget-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }

  /* ——— sidebar controls ——— */
  .transport { display: flex; gap: 8px; }
  .btn {
    flex: 1; padding: 9px 4px; border-radius: 7px;
    background: #1b1824; border: 1px solid var(--line-strong);
    color: var(--text); font-family: var(--font-mono); font-size: 11.5px;
    letter-spacing: 0.06em; cursor: pointer; transition: all 0.15s;
  }
  .btn:hover:not(:disabled) { border-color: var(--muted); background: #221e2e; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn-primary {
    flex: 1.6;
    background: color-mix(in oklab, var(--c-par) 16%, #1b1824);
    border-color: color-mix(in oklab, var(--c-par) 55%, transparent);
    color: var(--c-par);
  }
  .btn-primary:hover:not(:disabled) {
    background: color-mix(in oklab, var(--c-par) 26%, #1b1824);
    border-color: var(--c-par);
    box-shadow: 0 0 14px color-mix(in oklab, var(--c-par) 25%, transparent);
  }
  .ctl-divider { height: 1px; background: var(--line); margin: 16px 0 14px 0; }
  .ctl-row { margin-bottom: 16px; }
  .ctl-row.is-disabled { opacity: 0.45; pointer-events: none; }
  .ctl-label-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
  .ctl-label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .ctl-value { font-size: 12px; color: var(--c-par); }
  .ctl-caption { margin-top: 6px; font-size: 10.5px; color: var(--faint); line-height: 1.4; text-wrap: pretty; }
  .ctl-note {
    margin-top: 4px; font-size: 9.5px; color: var(--faint);
    letter-spacing: 0.06em; text-align: center;
  }
  .ctl-slider {
    -webkit-appearance: none; appearance: none; width: 100%; height: 22px;
    background: transparent; cursor: pointer; margin: 0; display: block;
  }
  .ctl-slider::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, color-mix(in oklab, var(--c-par) 50%, transparent), rgba(255,255,255,0.08));
  }
  .ctl-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%; margin-top: -5px;
    background: var(--text); border: 2px solid var(--c-par);
    box-shadow: 0 0 8px color-mix(in oklab, var(--c-par) 40%, transparent);
  }
  .ctl-slider::-moz-range-track {
    height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.08);
  }
  .ctl-slider::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--text); border: 2px solid var(--c-par);
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="js/engine.js"></script>
<script type="text/babel" src="js/tweaks-panel.jsx"></script>
<script type="text/babel" src="js/viz.jsx"></script>
<script type="text/babel" src="js/charts.jsx"></script>
<script type="text/babel" src="js/app.jsx"></script>
</body>
